name: Deploy

on:
  # 2026-06-25: push 자동 트리거 제거 (Alpha).
  # 이유: NETLIFY_AUTH_TOKEN 만료(403 Forbidden) → main push마다 deploy-netlify 실패 → 회장 메일로 "Run failed" 발송.
  # G2 홈페이지는 GitHub Pages(https://kgg2512.github.io/G2/, HTTP200)로 자동 서빙 중이라 Netlify 자동배포 불필요.
  # Netlify 배포를 재개하려면: 새 토큰 발급 → secrets 갱신 → Actions 탭에서 "Run workflow"로 수동 실행.
  workflow_dispatch:

jobs:
  deploy-netlify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Deploy to Netlify
        run: netlify deploy --prod --dir . --message "Manual deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
